name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VortexApi.slnx

      - name: Build
        run: dotnet build VortexApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VortexApi.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Empaquetar SDK
        run: |
          dotnet pack src/VortexApi.Client/VortexApi.Client.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/VortexApi.Suite/VortexApi.Suite.csproj --configuration Release --no-build --output artifacts

      - name: Publicar paquete del SDK
        uses: actions/upload-artifact@v7
        with:
          name: sdk-nupkg
          path: artifacts/*

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vortex-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    name: Infraestructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bicep (lint y build)
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"

      - name: infra/main.json al día
        run: |
          # Se ignora metadata (versión de Bicep y hash): solo importa el contenido de la plantilla.
          if ! diff <(jq -S 'del(.metadata)' infra/main.json) <(jq -S 'del(.metadata)' "$RUNNER_TEMP/main.json") > /dev/null; then
            echo "::error file=infra/main.json::Desactualizado. Ejecute: az bicep build --file infra/main.bicep --outfile infra/main.json"
            exit 1
          fi

      - name: Docker Compose de producción
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          sed -i 's/^VORTEX_ADMIN_PASSWORD=$/VORTEX_ADMIN_PASSWORD=x/; s/^SQL_SA_PASSWORD=$/SQL_SA_PASSWORD=x/' .env
          mkdir -p secrets && touch secrets/signing-key.pem
          docker compose config --quiet
