name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VortexApi.slnx

      - name: Build
        run: dotnet build VortexApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VortexApi.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vortex-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
