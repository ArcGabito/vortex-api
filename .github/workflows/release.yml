name: Release

# Al crear un tag de versión (v0.4.0, v0.4.0-beta.1, …):
# - Imagen Docker en GitHub Container Registry: ghcr.io/<owner>/vortex-api:<versión> (y :<mayor>.<menor>, :latest
#   solo para versiones estables).
# - SDK VortexApi.Client y base común VortexApi.Suite en GitHub Packages y, si existe el secreto NUGET_API_KEY, en nuget.org.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Versión y pruebas
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versión
        id: version
        run: |
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            # El tag puede agregar un sufijo (v0.4.0-beta.1), pero la base debe coincidir con Directory.Build.props.
            if [[ "${version%%-*}" != "${props%%-*}" ]]; then
              echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $props de Directory.Build.props."
              exit 1
            fi
          else
            version="$props-manual.$GITHUB_RUN_NUMBER"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Pruebas
        run: dotnet test VortexApi.slnx --configuration Release

  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vortex-api"
          version="${{ needs.version.outputs.value }}"
          tags="$image:$version"
          if [[ "${{ needs.version.outputs.prerelease }}" == "false" ]]; then
            tags="$tags,$image:${version%.*},$image:latest"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: VERSION=${{ needs.version.outputs.value }}
          labels: |
            org.opencontainers.image.title=Vortex Hub
            org.opencontainers.image.description=Hub de la suite Vortex (ERP, CRM, WMS, POS)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sdk:
    name: SDK NuGet
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Empaquetar
        run: |
          for project in VortexApi.Client VortexApi.Suite; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --output artifacts \
              -p:Version=${{ needs.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ needs.version.outputs.value }}
          path: artifacts/*

      - name: GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
