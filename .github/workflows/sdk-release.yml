name: Publicar SDK

# Publica VortexApi.Client al crear un tag de versión (v0.4.0, v0.4.0-beta.1, …).
# - GitHub Packages: siempre (usa GITHUB_TOKEN).
# - nuget.org: solo si existe el secreto NUGET_API_KEY.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Empaquetar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versión
        id: version
        run: |
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            # El tag puede agregar un sufijo (v0.4.0-beta.1), pero la base debe coincidir con Directory.Build.props.
            if [[ "${version%%-*}" != "${props%%-*}" ]]; then
              echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $props de Directory.Build.props."
              exit 1
            fi
          else
            version="$props-manual.$GITHUB_RUN_NUMBER"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Pruebas
        run: dotnet test VortexApi.slnx --configuration Release

      - name: Empaquetar
        run: >
          dotnet pack src/VortexApi.Client/VortexApi.Client.csproj --configuration Release --output artifacts
          -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ steps.version.outputs.value }}
          path: artifacts/*

      - name: GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
